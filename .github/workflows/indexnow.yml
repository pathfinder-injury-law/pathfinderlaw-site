# IndexNow: after each change to main is live, tell Bing and the other IndexNow engines which pages
# changed (scripts/indexnow.mjs explains how). No account and no secret: the key is a public file.
# "Run workflow" on the Actions tab sends every sitemap URL once (use it after this first deploys).
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in order, so each run compares against the deploy before it.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # First, before the new deploy goes out (Workers Builds takes 1 to 11 minutes).
      - name: Save the live sitemap
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs snapshot "$RUNNER_TEMP/before.json"

      - name: List new redirects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff "$BEFORE" "$GITHUB_SHA" -- public/_redirects > "$RUNNER_TEMP/redirects.diff"
          else
            : > "$RUNNER_TEMP/redirects.diff"
          fi

      - name: Wait for the deploy, then send changed pages
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs after-deploy "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/redirects.diff"

      - name: Send every sitemap URL once
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow.mjs all
